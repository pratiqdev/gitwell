[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitwell"
version = "0.1.0"
description = "Easy tracking and committing for frequent gitters."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["git", "cli", "commit", "version-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "colorama>=0.4.6",
    "inquirerpy>=0.3.4",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/pratiqdev/gitwell"

[project.scripts]
gitwell = "gitwell.cli:main"

[tool.setuptools]
packages = ["gitwell"]
